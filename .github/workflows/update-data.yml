name: Update PSMUX Data

on:
  schedule:
    # Mon and Thu at 06:00 UTC
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout psmux source (best effort)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: psmux/psmux
          path: psmux-src
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch raw GitHub data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .data

          echo "=== repo ==="
          gh api repos/psmux/psmux > .data/repo.json

          echo "=== contributors ==="
          gh api repos/psmux/psmux/contributors --paginate \
            | jq -s 'add // []' > .data/contributors.json

          echo "=== fork count ==="
          FORK_COUNT=$(gh api repos/psmux/psmux/forks --paginate --jq 'length' \
            | paste -sd+ | bc)
          echo "FORK_COUNT=${FORK_COUNT:-0}" >> "$GITHUB_ENV"

          echo "=== stargazers (login + company + name + bio + followers) ==="
          echo "[" > .data/stargazers.json
          CURSOR=""
          PAGE=0
          FIRST=1
          while true; do
            PAGE=$((PAGE + 1))
            if [ -z "$CURSOR" ]; then
              Q='query { repository(owner:"psmux",name:"psmux") { stargazers(first:100) { pageInfo { hasNextPage endCursor } nodes { login name company bio followers { totalCount } avatarUrl } } } }'
            else
              Q="query { repository(owner:\"psmux\",name:\"psmux\") { stargazers(first:100,after:\"$CURSOR\") { pageInfo { hasNextPage endCursor } nodes { login name company bio followers { totalCount } avatarUrl } } } }"
            fi
            RESP=$(gh api graphql -f "query=$Q")
            NODES=$(echo "$RESP" | jq -c '[.data.repository.stargazers.nodes[] | {login, name, company, bio, followers: (.followers.totalCount // 0), avatarUrl}]')
            COUNT=$(echo "$NODES" | jq 'length')
            if [ "$COUNT" -gt 0 ]; then
              ITEMS=$(echo "$NODES" | jq -c '.[]')
              while IFS= read -r line; do
                if [ "$FIRST" -eq 1 ]; then
                  printf '%s' "$line" >> .data/stargazers.json
                  FIRST=0
                else
                  printf ',\n%s' "$line" >> .data/stargazers.json
                fi
              done <<< "$ITEMS"
            fi
            HAS=$(echo "$RESP" | jq -r '.data.repository.stargazers.pageInfo.hasNextPage')
            CURSOR=$(echo "$RESP" | jq -r '.data.repository.stargazers.pageInfo.endCursor')
            echo "  page $PAGE, +$COUNT (hasNext=$HAS)"
            [ "$HAS" = "true" ] || break
          done
          echo "]" >> .data/stargazers.json
          echo "  total stargazers: $(jq 'length' .data/stargazers.json)"

          echo "=== ecosystem repos ==="
          gh search repos "psmux" --limit 200 \
            --json fullName,description,stargazersCount,language,owner \
            > .data/ecosystem.json

          echo "=== cross-repo issue mentions ==="
          gh search issues "psmux" --limit 200 \
            --json repository,number,title,url,state \
            > .data/issues.json

          echo "=== code mentions (dotfiles & configs) ==="
          gh search code "psmux" --limit 200 \
            --json repository,path \
            > .data/code.json || echo "[]" > .data/code.json

      - name: Build live-stats.json
        run: |
          python3 scripts/build-live-stats.py \
            --repo-json .data/repo.json \
            --contributors .data/contributors.json \
            --stargazers .data/stargazers.json \
            --ecosystem .data/ecosystem.json \
            --issue-mentions .data/issues.json \
            --code-mentions .data/code.json \
            --psmux-src psmux-src \
            --fork-count "${FORK_COUNT:-0}" \
            --out public/live-stats.json
        env:
          PYTHONUNBUFFERED: "1"

          echo "=== output preview ==="
          jq '. | {stars, forks, contributors, issues, companiesRepresented, universities, ecosystemRepos,
                   topCompanies: (.topCompanies | length),
                   topUniversities: (.topUniversities | length),
                   notableUsers: (.notableUsers | length),
                   ecosystemProjects: (.ecosystemProjects | length),
                   crossRepoMentions: (.crossRepoMentions | length),
                   dotfilesRepos: (.dotfilesRepos | length),
                   lastUpdated}' public/live-stats.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/live-stats.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: auto-refresh live stats $(date -u +%Y-%m-%d)"
          git push
