name: Update PSMUX Data

on:
  schedule:
    # Runs every Monday and Thursday at 6am UTC
    - cron: "0 6 * * 1,4"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch all stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "=== Fetching repo stats ==="
          REPO_JSON=$(gh api repos/psmux/psmux)
          STARS=$(echo "$REPO_JSON" | jq '.stargazers_count')
          FORKS=$(echo "$REPO_JSON" | jq '.forks_count')
          ISSUES=$(echo "$REPO_JSON" | jq '.open_issues_count')
          echo "Stars: $STARS, Forks: $FORKS, Issues: $ISSUES"

          echo "=== Fetching contributors ==="
          CONTRIBUTORS=$(gh api repos/psmux/psmux/contributors --paginate --jq 'length')
          echo "Contributors: $CONTRIBUTORS"

          echo "=== Fetching stargazer companies via GraphQL ==="
          COMPANIES_FILE=/tmp/companies_raw.txt
          > "$COMPANIES_FILE"
          CURSOR=""
          PAGE=0

          while true; do
            PAGE=$((PAGE + 1))
            if [ -z "$CURSOR" ]; then
              QUERY='query { repository(owner:"psmux",name:"psmux") { stargazers(first:100) { pageInfo { hasNextPage endCursor } nodes { login company } } } }'
            else
              QUERY="query { repository(owner:\"psmux\",name:\"psmux\") { stargazers(first:100,after:\"$CURSOR\") { pageInfo { hasNextPage endCursor } nodes { login company } } } }"
            fi

            RESULT=$(gh api graphql -f "query=$QUERY" 2>/dev/null)
            echo "$RESULT" | jq -r '.data.repository.stargazers.nodes[] | select(.company != null and .company != "") | .company' >> "$COMPANIES_FILE"

            HAS_NEXT=$(echo "$RESULT" | jq -r '.data.repository.stargazers.pageInfo.hasNextPage')
            CURSOR=$(echo "$RESULT" | jq -r '.data.repository.stargazers.pageInfo.endCursor')
            echo "Page $PAGE done"

            if [ "$HAS_NEXT" != "true" ]; then
              break
            fi
          done

          echo "=== Processing companies ==="
          # Normalize: trim whitespace, remove leading @
          sed -i 's/^[[:space:]]*//;s/[[:space:]]*$//;s/^@//' "$COMPANIES_FILE"

          # Count unique companies
          UNIQUE_COMPANIES=$(sort -uf "$COMPANIES_FILE" | wc -l)
          echo "Unique companies: $UNIQUE_COMPANIES"

          # Build top companies JSON array (sorted by frequency)
          COMPANIES_JSON=$(sort "$COMPANIES_FILE" | uniq -ic | sort -rn | head -60 | \
            awk '{count=$1; $1=""; sub(/^[[:space:]]+/,""); print "{\"name\":\""$0"\",\"count\":"count"}"}' | \
            jq -s '.')
          echo "Top companies: $(echo "$COMPANIES_JSON" | jq 'length')"

          # Count universities from company field
          EDU_PATTERN='\.edu|\.ac\.|[Uu]niversity|[Uu]niversit|[Ii]nstitut|[Cc]ollege|[Pp]olytechnic|KAIST|ETH|MIT'
          UNIQUE_UNIVERSITIES=$(grep -iE "$EDU_PATTERN" "$COMPANIES_FILE" | sort -uf | wc -l)
          echo "Unique universities: $UNIQUE_UNIVERSITIES"

          echo "=== Searching ecosystem repos ==="
          ECOSYSTEM=$(gh search repos "psmux" --limit 200 --json fullName --jq 'length')
          echo "Ecosystem repos: $ECOSYSTEM"

          echo "=== Fetching fork count ==="
          FORK_COUNT=$(gh api repos/psmux/psmux/forks --paginate --jq 'length' | paste -sd+ | bc)
          echo "Total forks: $FORK_COUNT"

          echo "=== Writing output ==="
          jq -n \
            --argjson stars "$STARS" \
            --argjson forks "${FORK_COUNT:-$FORKS}" \
            --argjson contributors "$CONTRIBUTORS" \
            --argjson issues "$ISSUES" \
            --argjson companiesRepresented "$UNIQUE_COMPANIES" \
            --argjson universities "$UNIQUE_UNIVERSITIES" \
            --argjson ecosystemRepos "$ECOSYSTEM" \
            --argjson topCompanies "$COMPANIES_JSON" \
            --arg lastUpdated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              stars: $stars,
              forks: $forks,
              contributors: $contributors,
              issues: $issues,
              companiesRepresented: $companiesRepresented,
              universities: $universities,
              ecosystemRepos: $ecosystemRepos,
              topCompanies: $topCompanies,
              lastUpdated: $lastUpdated
            }' > public/live-stats.json

          echo "=== Final output ==="
          cat public/live-stats.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/live-stats.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update live stats $(date -u +%Y-%m-%d)"
          git push
