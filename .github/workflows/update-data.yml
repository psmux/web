name: Update PSMUX Data

on:
  schedule:
    # Runs every Monday at 6am UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stargazer data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "=== Fetching repo stats ==="
          REPO_JSON=$(gh api repos/psmux/psmux)
          STARS=$(echo "$REPO_JSON" | jq '.stargazers_count')
          FORKS=$(echo "$REPO_JSON" | jq '.forks_count')
          ISSUES=$(echo "$REPO_JSON" | jq '.open_issues_count')

          echo "Stars: $STARS, Forks: $FORKS, Issues: $ISSUES"

          echo "=== Fetching all stargazer logins ==="
          gh api repos/psmux/psmux/stargazers --paginate --jq '.[].login' > /tmp/stargazers.txt
          TOTAL_STARS=$(wc -l < /tmp/stargazers.txt)
          echo "Total stargazers: $TOTAL_STARS"

          echo "=== Fetching user profiles (company info) ==="
          mkdir -p /tmp/profiles
          COMPANY_COUNT=0
          COMPANIES_FILE=/tmp/companies.txt

          > "$COMPANIES_FILE"

          # Process in batches to stay within rate limits
          while IFS= read -r login; do
            PROFILE=$(gh api "users/$login" --jq '{login, company: .company, bio: .bio, followers: .followers}' 2>/dev/null || echo '{}')
            COMPANY=$(echo "$PROFILE" | jq -r '.company // empty')
            if [ -n "$COMPANY" ]; then
              echo "$COMPANY" >> "$COMPANIES_FILE"
              COMPANY_COUNT=$((COMPANY_COUNT + 1))
            fi
            # Brief pause to be kind to the API
            sleep 0.05
          done < /tmp/stargazers.txt

          UNIQUE_COMPANIES=$(sort -u "$COMPANIES_FILE" | wc -l)
          echo "Users with company: $COMPANY_COUNT, Unique companies: $UNIQUE_COMPANIES"

          echo "=== Fetching contributors ==="
          CONTRIBUTORS=$(gh api repos/psmux/psmux/contributors --jq 'length')

          echo "=== Fetching forks ==="
          FORK_COUNT=$(gh api repos/psmux/psmux/forks --paginate --jq 'length' | paste -sd+ | bc)

          echo "=== Searching ecosystem repos ==="
          ECOSYSTEM=$(gh search repos "psmux" --limit 100 --json fullName --jq 'length')

          echo "=== Writing output ==="
          cat > /tmp/live-stats.json <<EOF
          {
            "stars": $STARS,
            "forks": $FORKS,
            "contributors": $CONTRIBUTORS,
            "issues": $ISSUES,
            "companiesRepresented": $UNIQUE_COMPANIES,
            "ecosystemRepos": $ECOSYSTEM,
            "lastUpdated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          cat /tmp/live-stats.json

          # Copy to repo
          cp /tmp/live-stats.json public/live-stats.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/live-stats.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update live stats $(date -u +%Y-%m-%d)"
          git push
